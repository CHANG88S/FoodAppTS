name: Repository Maintenance

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # Close stale issues and PRs
  stale-management:
    name: Close Stale Issues & PRs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Close stale issues
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: 'This issue has been automatically marked as stale because it has had no activity for 30 days. It will be closed in 14 days if there is no further activity.'
          close-issue-message: 'This issue has been automatically closed due to inactivity for 14 days. Feel free to reopen if you\'re still working on it!'
          stale-pr-label: 'stale'
          close-pr-message: 'This PR has been automatically closed due to inactivity for 14 days. Feel free to reopen if you\'re still working on it!'
          exempt-issue-labels: 'bug,enhancement,good first issue,help wanted,priority'
          exempt-pr-labels: 'work-in-progress,under-review,priority'

  # Dependency update check
  dependency-check:
    name: Check for Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for outdated dependencies
        working-directory: ./foodraterts
        run: |
          npm outdated || true

      # Report-only: known advisories in transitive deps of react-native/expo
      # can't be patched without a framework upgrade (same policy as CI).
      - name: Check for security vulnerabilities
        working-directory: ./foodraterts
        run: npm audit --audit-level=high
        continue-on-error: true

  # Project health report
  project-health:
    name: Project Health Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./foodraterts/package-lock.json

      - name: Install dependencies
        working-directory: ./foodraterts
        run: npm ci

      - name: Generate project health report
        working-directory: ./foodraterts
        run: |
          echo "## 📊 FoodRater Project Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated on: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check TypeScript health
        working-directory: ./foodraterts
        run: |
          TS_ERRORS=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || echo "0")
          echo "### TypeScript Status" >> $GITHUB_STEP_SUMMARY
          echo "- Errors: $TS_ERRORS" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $([ $TS_ERRORS -eq 0 ] && echo "✅ Clean" || echo "❌ Has errors")" >> $GITHUB_STEP_SUMMARY

      - name: Check project structure
        working-directory: ./foodraterts
        run: |
          echo "### Project Structure" >> $GITHUB_STEP_SUMMARY
          echo "- Components: $(find components -name "*.tsx" -o -name "*.ts" 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Screens: $(find app -name "*.tsx" 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Convex functions: $(find convex -name "*.ts" 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY

  # Issue triage automation
  issue-triage:
    name: Auto-Triage New Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Triage new issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labels = ['needs-triage'];
            const comment = `Thanks for opening this issue! 🎉

            **Next Steps:**
            1. Our team will review this issue shortly
            2. We'll update the status and assign labels
            3. Check back here for updates

            **Issue Information:**
            - **Title**: ${issue.title}
            - **State**: ${issue.state}
            - **Created**: ${new Date(issue.created_at).toLocaleDateString()}

            For priority issues, please tag team members or use priority labels.`;

            // Add labels
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labels
            });

            // Add comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

            console.log(`Issue ${issue.number} triaged successfully`);
