name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment != 'preview'
    environment:
      name: production
      url: https://expo.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./foodraterts/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./foodraterts
        run: npm ci

      - name: Build iOS for production
        working-directory: ./foodraterts
        run: eas build --platform ios --profile production --non-interactive

      - name: Build Android for production
        working-directory: ./foodraterts
        run: eas build --platform android --profile production --non-interactive

      - name: Report deployment success
        run: |
          echo "## 🚀 Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "iOS and Android apps built and submitted to app stores." >> $GITHUB_STEP_SUMMARY

  # Deploy to preview
  deploy-preview:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'preview'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./foodraterts/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./foodraterts
        run: npm ci

      - name: Build for preview
        working-directory: ./foodraterts
        run: eas build --platform all --profile preview --non-interactive

      - name: Report preview deployment
        run: |
          echo "## 🔀 Preview Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "Preview builds created for testing." >> $GITHUB_STEP_SUMMARY

  # Post-deployment notification
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-preview]
    if: always()

    steps:
      - name: Report deployment status
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ] || [ "${{ needs.deploy-preview.result }}" == "success" ]; then
            echo "## ✅ Deployment Completed Successfully" >> $GITHUB_STEP_SUMMARY
            echo "**Status**: Production build complete" >> $GITHUB_STEP_SUMMARY
            echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "Please check the deployment logs." >> $GITHUB_STEP_SUMMARY
          fi
