name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  # Automated PR review
  pr-review:
    name: Automated PR Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./foodraterts/package-lock.json

      - name: Install dependencies
        working-directory: ./foodraterts
        run: npm ci

      - name: Check PR size
        working-directory: ./foodraterts
        run: |
          FILES_CHANGED=$(git diff --name-only HEAD~10..HEAD | wc -l)
          echo "## 📊 PR Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Files changed: $FILES_CHANGED" >> $GITHUB_STEP_SUMMARY

          if [ $FILES_CHANGED -gt 50 ]; then
            echo "- ⚠️ Large PR detected ($FILES_CHANGED files)" >> $GITHUB_STEP_SUMMARY
            echo "- Consider splitting into smaller PRs" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ PR size is reasonable" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for breaking changes
        working-directory: ./foodraterts
        run: |
          echo "### Breaking Changes Check" >> $GITHUB_STEP_SUMMARY
          BREAKING=$(git diff HEAD~10..HEAD | grep -i "BREAKING\|deprecated\|removed" | wc -l || echo "0")
          if [ $BREAKING -gt 0 ]; then
            echo "- ⚠️ Potential breaking changes found: $BREAKING" >> $GITHUB_STEP_SUMMARY
            echo "- Please ensure migration guide is provided" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ No breaking changes detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for TODO/FIXME
        working-directory: ./foodraterts
        run: |
          echo "### Code Quality Markers" >> $GITHUB_STEP_SUMMARY
          TODO_COUNT=$(git diff HEAD~10..HEAD | grep -i "TODO\|FIXME\|XXX" | wc -l || echo "0")
          if [ $TODO_COUNT -gt 0 ]; then
            echo "- ℹ️ TODO/FIXME comments: $TODO_COUNT" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ No TODO markers found" >> $GITHUB_STEP_SUMMARY
          fi

  # PR description validation
  pr-validation:
    name: PR Description Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PR description
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            console.log(`Validating PR #${pr.number}`);

            // Check for PR description
            if (body.length < 20) {
              core.setFailed('PR description is too short. Please provide more details about your changes.');
              return;
            }

            // Check for required sections
            const required = ['changes', 'testing', 'screenshots'];
            const missing = required.filter(section => !body.toLowerCase().includes(section));

            if (missing.length > 0) {
              core.warning(`Consider adding: ${missing.join(', ')}`);
            }

            console.log('✅ PR validation passed');

  # Branch protection check
  branch-protection:
    name: Branch Protection Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check branch protection rules
        run: |
          echo "### 🛡️ Branch Protection Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ All branch protection rules passed" >> $GITHUB_STEP_SUMMARY

  # PR labeling automation
  auto-label:
    name: Automatic PR Labeling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-label PR
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  # PR size estimation
  size-estimation:
    name: PR Size & Impact Estimation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Estimate review time
        run: |
          FILES_CHANGED=$(git diff --name-only HEAD~10..HEAD | wc -l)
          LINES_CHANGED=$(git diff HEAD~10..HEAD | wc -l)

          echo "## ⏱️ Review Time Estimation" >> $GITHUB_STEP_SUMMARY
          echo "- Files changed: $FILES_CHANGED" >> $GITHUB_STEP_SUMMARY
          echo "- Lines changed: $LINES_CHANGED" >> $GITHUB_STEP_SUMMARY

          if [ $FILES_CHANGED -lt 10 ]; then
            echo "- ⏰ Estimated review time: 1-2 hours" >> $GITHUB_STEP_SUMMARY
          elif [ $FILES_CHANGED -lt 25 ]; then
            echo "- ⏰ Estimated review time: 2-4 hours" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏰ Estimated review time: 4-8 hours" >> $GITHUB_STEP_SUMMARY
          fi
